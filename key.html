<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zorvyn Script Hub - Key</title>
  <link rel="icon" href="/a/brand_transparent_tiny.png" type="image/png">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-subtle: #12121a;
      --fg: #e8e8f0;
      --muted: #6b6b80;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --card: #1a1a24;
      --border: #2a2a3a;
      --error: #ff5f57;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* Key Page */
    .key-container {
      max-width: 500px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
    }

    .logo-small {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.5rem;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }

    .key-value {
      font-family: "SF Mono", "Fira Mono", "Droid Sans Mono", "Consolas", monospace;
      font-size: 1.3rem;
      word-break: break-all;
      background: var(--bg-subtle);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      margin: 1rem auto;
      display: block;
      min-width: 200px;
    }

    .expires-info {
      margin: 1.5rem 0;
      padding: 1rem;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .expires-info.expired {
      background: rgba(255, 95, 87, 0.1);
      border: 1px solid rgba(255, 95, 87, 0.3);
      color: var(--error);
    }

    .expires-info.valid {
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.3);
    }

    .discord-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border-radius: 4px;
      font-weight: 500;
    }

    .discord-link:hover {
      background: #00f0bb;
    }

    .key-expires-timestamp {
      background: var(--bg-subtle);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="key-container">
    <img src="/a/brand_transparent_tiny.png" alt="Zorvyn Script Hub" class="logo-small">

    <div class="key-value" id="keyValue">LOADING...</div>

    <div class="expires-info" id="expiresInfo">
      <div id="expiresText">Checking expiration...</div>
      <div class="key-expires-timestamp" id="timestamp">—</div>
    </div>

    <a href="https://discord.gg/your-invite" class="discord-link" id="discordLink">Join Discord</a>
  </div>

  <script>
    // Parse query parameters from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key');
    const expires = urlParams.get('expires');

    const keyValueEl = document.getElementById('keyValue');
    const expiresInfoEl = document.getElementById('expiresInfo');
    const expiresTextEl = document.getElementById('expiresText');
    const timestampEl = document.getElementById('timestamp');
    const discordLinkEl = document.getElementById('discordLink');

    // Set the key display
    if (key) {
      keyValueEl.textContent = key;
      keyValueEl.style.display = 'block';
    } else {
      keyValueEl.textContent = 'No key provided';
      keyValueEl.style.display = 'block';
    }

    // Determine if the key is expired
    const expiryTime = expires ? parseInt(expires, 10) : 0;
    const now = Math.floor(Date.now() / 1000);
    let isExpired = false;

    if (expiryTime > 0) {
      timestampEl.textContent = `Expires: ${new Date(expiryTime * 1000).toLocaleString()}`;

      if (now >= expiryTime) {
        isExpired = true;
        expiresInfoEl.classList.add('expired');
        expiresTextEl.textContent = 'This key has expired';
        discordLinkEl.textContent = 'Get New Key on Discord';
        discordLinkEl.href = 'https://discord.gg/invite';
      } else {
        isExpired = false;
        expiresInfoEl.classList.add('valid');
        expiresTextEl.textContent = 'Key is valid';
      }
    } else {
      timestampEl.textContent = 'Never expires';
    }

    // Update UI based on expiry state
    if (isExpired) {
      expiresInfoEl.style.display = 'block';
    } else {
      expiresInfoEl.style.display = 'block';
    }

    // Handle Discord link visibility
    if (isExpired) {
      discordLinkEl.style.display = 'block';
    }
  </script>
</body>
</html>
